<section class="section skills" id="skills">
  <div class="container">
    <p class="eyebrow">Boîte à outils</p>
    <h2 class="section-title">
      Une expertise <span class="gradient-text">technique large et profonde</span>
    </h2>

    <div class="skills__grid">
      @for (group of skillGroups; track group.category; let i = $index) {
        <div class="skills__card" [appRevealOnScroll]="delayFor(i)">
          <div class="skills__card-head">
            <span class="skills__icon">{{ group.icon }}</span>
            <h3 class="skills__category">{{ group.category }}</h3>
          </div>
          <div class="skills__tags">
            @for (item of group.items; track item) {
              <span class="tag">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
